name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # ubuntu-22.04: mono-complete + nuget are pre-installed.
    # dotnet SDK added via setup-dotnet for Roslyn (C#10).
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Resolve version from the tag (strips leading "v") ──────────────────
      - name: Set version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.9.0
          VERSION="${TAG#v}"                # e.g. 0.9.0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # ── Install .NET SDK (Roslyn C#10) ──────────────────────────────────────
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ── Restore NuGet packages ──────────────────────────────────────────────
      #  This pulls, among others:
      #    • Microsoft.NETFramework.ReferenceAssemblies.net48 — official .NET 4.8
      #      BCL + Facades/netstandard.dll; its .targets sets TargetFrameworkRootPath
      #      and disables FrameworkPathOverride so the build uses real MS assemblies.
      #    • JotunnLib — Jotunn.dll + JotunnLib.props (corlib HintPaths)
      #    • ILRepack.Lib.MSBuild.Task — ILRepacker post-build target
      #    • Pfhoenix.Valheim.ModProjectReferences — game DLLs for compile refs
      - name: Restore NuGet packages
        run: |
          nuget restore DrakesReskinIt.csproj -PackagesDirectory packages

      # ── Stage game / BepInEx DLLs from Pfhoenix ─────────────────────────────
      #
      #  Fake "Valheim install" tree:
      #    ci_valheim/valheim_Data/Managed/          ← CorlibPath
      #      publicized_assemblies/                  ← PublicizedAssembliesPath
      #    ci_valheim/BepInEx/core/                  ← BepInExPath
      #
      #  VALHEIM_INSTALL=ci_valheim satisfies JotunnLib's Paths.props HintPaths.
      # ────────────────────────────────────────────────────────────────────────
      - name: Stage game DLLs from Pfhoenix package
        run: |
          PFHOENIX_LIB=$(ls -d packages/Pfhoenix.Valheim.ModProjectReferences.*/lib/net46 2>/dev/null | head -1)
          if [ -z "$PFHOENIX_LIB" ]; then
            echo "ERROR: Pfhoenix package not found" >&2; ls packages/ >&2; exit 1
          fi
          echo "Pfhoenix lib: $PFHOENIX_LIB"

          MANAGED="ci_valheim/valheim_Data/Managed"
          PUBLICIZED="$MANAGED/publicized_assemblies"
          BEPINEX="ci_valheim/BepInEx/core"
          mkdir -p "$MANAGED" "$PUBLICIZED" "$BEPINEX"

          cp "$PFHOENIX_LIB/"*.dll "$MANAGED/"

          cp "$PFHOENIX_LIB/assembly_valheim.dll" "$PUBLICIZED/assembly_valheim_publicized.dll"
          cp "$PFHOENIX_LIB/assembly_utils.dll"   "$PUBLICIZED/assembly_utils_publicized.dll"
          cp "$PFHOENIX_LIB/gui_framework.dll"    "$PUBLICIZED/gui_framework_publicized.dll"

          for src in assembly_googleanalytics assembly_guiutils assembly_lux \
                     assembly_postprocessing assembly_simplemeshcombine \
                     assembly_sunshafts SoftReferenceableAssets; do
            [ -f "$PFHOENIX_LIB/$src.dll" ] && \
              cp "$PFHOENIX_LIB/$src.dll" "$PUBLICIZED/${src}_publicized.dll" || true
          done

          cp "$PFHOENIX_LIB/0Harmony.dll" "$BEPINEX/"
          cp "$PFHOENIX_LIB/bepinex.dll"  "$BEPINEX/BepInEx.dll"

          echo "VALHEIM_INSTALL=$(pwd)/ci_valheim" >> "$GITHUB_ENV"

      # ── Build (Release) ─────────────────────────────────────────────────────
      #  dotnet msbuild: Roslyn from .NET 8 → C# 10.
      #  Directory.Build.props (repo file) reads CI_NET48_FWPATH → sets
      #    TargetFrameworkRootPath to the net48 ref pack (mscorlib + netstandard).
      #  Directory.Build.targets (repo file) reads CI_SKIP_POST_BUILD → no-ops
      #    CopyOutput (Windows path + wrong-case Readme.md) and PackageMod
      #    (PowerShell Compress-Archive). Zip assembled in the next step.
      - name: Build
        env:
          CI_NET48_FWPATH: ${{ github.workspace }}/packages/Microsoft.NETFramework.ReferenceAssemblies.net48.1.0.3/build
          CI_SKIP_POST_BUILD: "true"
        run: |
          CI_ROOT="$(pwd)/ci_valheim"
          MANAGED="$CI_ROOT/valheim_Data/Managed"
          dotnet msbuild DrakesReskinIt.csproj \
            /p:Configuration=Release \
            /p:TargetFrameworkVersion=v4.8 \
            /p:BepInExPath="$CI_ROOT/BepInEx" \
            /p:CorlibPath="$MANAGED" \
            /p:PublicizedAssembliesPath="$MANAGED/publicized_assemblies" \
            /p:Version="${{ steps.ver.outputs.version }}" \
            /t:Build \
            /v:minimal

      # ── Assemble Thunderstore zip (mirrors PackageMod target) ────────────────
      - name: Assemble Thunderstore package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG_DIR="DrakeMods-DrakesReskinIt-${VERSION}"
          ZIP_NAME="DrakeMods-DrakesReskinIt-${VERSION}.zip"
          mkdir -p "$PKG_DIR"
          cp bin/Release/DrakesReskinIt.dll "$PKG_DIR/"
          cp README.md                      "$PKG_DIR/"
          cp icon.png                       "$PKG_DIR/"
          cp CHANGELOG.md                   "$PKG_DIR/"
          dotnet msbuild DrakesReskinIt.csproj \
            /p:Version="$VERSION" \
            /p:ThunderstoreManifestDir="$PKG_DIR" \
            /t:WriteThunderstoreManifest \
            /v:minimal
cd "$PKG_DIR" && zip -r "../$ZIP_NAME" . && cd ..

          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP_NAME"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PKG_DIR: DrakeMods-DrakesReskinIt-${{ steps.ver.outputs.version }}

      # ── Create GitHub Release and attach the zip ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakesReskinIt ${{ steps.ver.outputs.version }}"
          prerelease: true
          body: |
            ## DrakesReskinIt v${{ steps.ver.outputs.version }}

            Pre-release build for testing before Thunderstore publish.

            ### Install
            Drop the zip into **r2modman** or **Thunderstore Mod Manager** via the "Import local mod" button, or manually extract into:
            ```
            BepInEx/plugins/DrakeMods-DrakesRenameit/
            ```

            ---
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for what's new.
          files: ${{ steps.pkg.outputs.zip }}



